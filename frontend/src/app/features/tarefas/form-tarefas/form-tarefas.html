<form [formGroup]="form" class="form-tarefas">
    <div class="form-group">
        <label for="nome">Nome*</label>
        <input id="nome" type="text" formControlName="nome" placeholder="Digite o nome da tarefa">
    </div>

    <div class="form-group">
        <label for="descricao">Descrição</label>
        <input id="descricao" type="text" formControlName="descricao" placeholder="Descrição opcional">
    </div>

    <div class="form-group half-width">
        <label for="prioridade">Prioridade*</label>
        <select id="prioridade" formControlName="prioridade">
            <option *ngFor="let p of prioridades" [value]="p">{{ p }}</option>
        </select>
    </div>

    <div class="form-group half-width">
        <label for="situacao">Situação</label>
        <input id="situacao" type="text" [value]="form.get('situacao')?.value" disabled>
    </div>

    <div class="form-group half-width">
        <label for="dataPrevistaConclusao">Data Prevista*</label>
        <input id="dataPrevistaConclusao" type="date" formControlName="dataPrevistaConclusao"
            [min]="hoje | date:'yyyy-MM-dd'">
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-primary" (click)="save()">Salvar</button>
        <button type="button" class="btn btn-secondary" (click)="router.navigate(['/tarefas'])">Cancelar</button>
    </div>

</form>
