<div class="app-container">

    <h2>Lista de Tarefas</h2>

    <form [formGroup]="filtroForm" class="filtros">
        <input type="text" placeholder="Nome" formControlName="nomeFiltro">

        <select formControlName="prioridade">
            <option value="">Todas Prioridades</option>
            <option *ngFor="let p of prioridades" [value]="p">{{ p }}</option>
        </select>

        <select formControlName="situacao">
            <option value="">Todas Situações</option>
            <option *ngFor="let s of situacoes" [value]="s">{{ s }}</option>
        </select>

        <button type="button" class="btn btn-primary" (click)="carregarTarefas()">Filtrar</button>
        <button type="button" class="btn btn-secondary" (click)="limparFiltros()">Limpar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Prioridade</th>
                <th>Situação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let tarefa of tarefas">
                <td>{{ tarefa.nome }}</td>
                <td>{{ tarefa.prioridade }}</td>
                <td>{{ tarefa.situacao }}</td>
                <td>
                    <button class="btn btn-edit" (click)="editar(tarefa)">✏️</button>
                    <button *ngIf="tarefa.situacao !== 'CONCLUIDA'" class="btn btn-success"
                        (click)="concluir(tarefa)">✔️</button>
                    <button *ngIf="tarefa.situacao !== 'PENDENTE'" class="btn btn-warning"
                        (click)="pendente(tarefa)">🔄</button>
                    <button class="btn btn-danger" (click)="excluir(tarefa)">🗑️</button>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="pagination-info">
        Total de tarefas: {{ totalRecords }}
    </div>

</div>
